version: '3.9'
services:
  frontend:
    build: ./apps/frontend
    ports: ['3000:80']
    depends_on: [backend]
    environment:
      VITE_API_URL: http://localhost:8080

  backend:
    build: ./apps/backend
    ports: ['8080:8080']
    environment:
      DATABASE_URL: postgres://mijil:secret@db:5432/mijil
      DB_HOST: db
      DB_PORT: "5432"
      DB_NAME: mijil
      DB_USER: mijil
      DB_PASSWORD: secret
      NODE_ENV: development
    depends_on: [db]

  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: mijil
      POSTGRES_USER: mijil
      POSTGRES_PASSWORD: secret
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./apps/database/init.sql:/docker-entrypoint-initdb.d/init.sql
    ports: ['5432:5432']

volumes:
  pgdata:
