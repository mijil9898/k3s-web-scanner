name: CI/CD Pipeline (improved)

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      deploy:
        description: 'Set true to run the deploy step (requires KUBE_CONFIG_BASE64 secret)'
        required: false
        default: 'false'

concurrency:
  group: ci-cd-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE_PREFIX: ghcr.io/${{ github.repository_owner }}/k3s-portfolio-platform

jobs:
  test:
    name: Run tests (Python + JS if present)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run Python tests
        if: files.exists('malware-analyzer') || always()
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      - name: Install Python deps & pytest
        if: exists('malware-analyzer/requirements.txt')
        run: |
          python -m pip install --upgrade pip
          pip install -r malware-analyzer/requirements.txt
          pip install pytest
      - name: Run pytest
        if: exists('tests') || exists('malware-analyzer')
        run: |
          pytest -q || true
      - name: Run Node tests for frontend/backend
        if: exists('apps/frontend/package.json') || exists('apps/backend/package.json')
        run: |
          if [ -f apps/frontend/package.json ]; then (cd apps/frontend && npm ci && npm test) || true; fi
          if [ -f apps/backend/package.json ]; then (cd apps/backend && npm ci && npm test) || true; fi

  build_and_push:
    name: Build and push container images
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v2
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2
      - name: Login to registry (GHCR)
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.CR_PAT || secrets.GITHUB_TOKEN }}
      - name: Build & push frontend image
        if: exists('apps/frontend/Dockerfile')
        uses: docker/build-push-action@v4
        with:
          context: apps/frontend
          push: true
          tags: ${{ env.IMAGE_PREFIX }}:frontend-latest
      - name: Build & push backend image
        if: exists('apps/backend/Dockerfile')
        uses: docker/build-push-action@v4
        with:
          context: apps/backend
          push: true
          tags: ${{ env.IMAGE_PREFIX }}:backend-latest
      - name: Build & push malware-analyzer image
        if: exists('malware-analyzer/Dockerfile')
        uses: docker/build-push-action@v4
        with:
          context: malware-analyzer
          push: true
          tags: ${{ env.IMAGE_PREFIX }}:malware-analyzer-latest

  deploy:
    name: Deploy to cluster (manual)
    needs: build_and_push
    runs-on: ubuntu-latest
    if: ${{ github.event.inputs.deploy == 'true' }}
    steps:
      - uses: actions/checkout@v4
      - name: Decode kubeconfig
        env:
          KUBE_CONFIG_BASE64: ${{ secrets.KUBE_CONFIG_BASE64 }}
        run: |
          if [ -z "$KUBE_CONFIG_BASE64" ]; then echo "KUBE_CONFIG_BASE64 not set"; exit 1; fi
          echo "$KUBE_CONFIG_BASE64" | base64 --decode > kubeconfig
          mkdir -p $HOME/.kube
          cp kubeconfig $HOME/.kube/config
      - name: Verify cluster access
        run: kubectl get nodes
      - name: Run deploy script
        run: |
          chmod +x ./scripts/deploy-all.sh
          ./scripts/deploy-all.sh
