name: CI/CD Pipeline (improved)

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      deploy:
        description: 'Set true to run the deploy step (requires KUBE_CONFIG_BASE64 secret)'
        required: false
        default: 'false'

concurrency:
  group: ci-cd-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE_PREFIX: ghcr.io/${{ github.repository_owner }}/k3s-portfolio-platform

jobs:
  build_and_scan:
    name: Build, scan, push images
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU and buildx
        uses: docker/setup-buildx-action@v2

      - name: Login to GHCR
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.CR_PAT || secrets.GITHUB_TOKEN }}

      - name: Build & push frontend (if present)
        run: |
          if [ -f apps/frontend/Dockerfile ]; then
            docker build -t ${{ env.IMAGE_PREFIX }}:frontend-latest apps/frontend
            docker push ${{ env.IMAGE_PREFIX }}:frontend-latest
          else
            echo 'no frontend Dockerfile'
          fi

      - name: Trivy scan frontend (if image exists)
        run: |
          if docker manifest inspect ${{ env.IMAGE_PREFIX }}:frontend-latest >/dev/null 2>&1; then
            docker run --rm aquasecurity/trivy:0.28.0 image --quiet --format json --output trivy-frontend.json ${{ env.IMAGE_PREFIX }}:frontend-latest || true
          else
            echo 'frontend image not found, skipping trivy'
          fi

      - name: Build & push backend (if present)
        run: |
          if [ -f apps/backend/Dockerfile ]; then
            docker build -t ${{ env.IMAGE_PREFIX }}:backend-latest apps/backend
            docker push ${{ env.IMAGE_PREFIX }}:backend-latest
          else
            echo 'no backend Dockerfile'
          fi

      - name: Trivy scan backend (if image exists)
        run: |
          if docker manifest inspect ${{ env.IMAGE_PREFIX }}:backend-latest >/dev/null 2>&1; then
            docker run --rm aquasecurity/trivy:0.28.0 image --quiet --format json --output trivy-backend.json ${{ env.IMAGE_PREFIX }}:backend-latest || true
          else
            echo 'backend image not found, skipping trivy'
          fi

      - name: Build & push malware-analyzer (if present)
        run: |
          if [ -f malware-analyzer/Dockerfile ]; then
            docker build -t ${{ env.IMAGE_PREFIX }}:malware-analyzer-latest malware-analyzer
            docker push ${{ env.IMAGE_PREFIX }}:malware-analyzer-latest
          else
            echo 'no malware-analyzer Dockerfile'
          fi

      - name: Trivy scan malware-analyzer (if image exists)
        run: |
          if docker manifest inspect ${{ env.IMAGE_PREFIX }}:malware-analyzer-latest >/dev/null 2>&1; then
            docker run --rm aquasecurity/trivy:0.28.0 image --quiet --format json --output trivy-malware-analyzer.json ${{ env.IMAGE_PREFIX }}:malware-analyzer-latest || true
          else
            echo 'malware-analyzer image not found, skipping trivy'
          fi

      - name: Upload Trivy reports
        uses: actions/upload-artifact@v4
        with:
          name: trivy-reports
          path: |
            trivy-frontend.json
            trivy-backend.json
            trivy-malware-analyzer.json

      - name: Summarize security scan and fail on CRITICAL
        run: |
          CRITICAL=0
          HIGH=0
          for f in trivy-*.json; do
            if [ -f "$f" ]; then
              c=$(jq '[.Results[]? | .Vulnerabilities[]? | select(.Severity=="CRITICAL")] | length' "$f" 2>/dev/null || echo 0)
              h=$(jq '[.Results[]? | .Vulnerabilities[]? | select(.Severity=="HIGH")] | length' "$f" 2>/dev/null || echo 0)
              CRITICAL=$((CRITICAL + c))
              HIGH=$((HIGH + h))
            fi
          done
          echo "Security summary: CRITICAL=$CRITICAL HIGH=$HIGH"
          if [ "$CRITICAL" -gt 0 ]; then
            echo "Failing pipeline due to CRITICAL vulnerabilities"
            exit 1
          fi

  deploy:
    name: Deploy to cluster (manual)
    needs: build_and_scan
    runs-on: ubuntu-latest
    if: ${{ github.event.inputs.deploy == 'true' }}
    steps:
      - uses: actions/checkout@v4
      - name: Decode kubeconfig
        env:
          KUBE_CONFIG_BASE64: ${{ secrets.KUBE_CONFIG_BASE64 }}
        run: |
          if [ -z "$KUBE_CONFIG_BASE64" ]; then echo "KUBE_CONFIG_BASE64 not set"; exit 1; fi
          echo "$KUBE_CONFIG_BASE64" | base64 --decode > kubeconfig
          mkdir -p $HOME/.kube
          cp kubeconfig $HOME/.kube/config
      - name: Verify cluster access
        run: kubectl get nodes
      - name: Run deploy script
        run: |
          chmod +x ./scripts/deploy-all.sh
          ./scripts/deploy-all.sh
