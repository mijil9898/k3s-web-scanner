name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]
  workflow_dispatch: {}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ──────────────────────────────────────────────
  # 1. Frontend — Validation & Build Dry-run
  # ──────────────────────────────────────────────
  check-frontend:
    name: Frontend — Validate & Dry-run
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: apps/frontend/package.json

      - name: Validate package.json
        run: node -e "JSON.parse(require('fs').readFileSync('package.json','utf8')); console.log('✅ package.json valid')"

      - name: Install dependencies
        run: npm install --ignore-scripts

      # Prettier & ESLint (nếu có cấu hình, không thì bỏ qua lỗi)
      - name: Check Formatting (Prettier)
        continue-on-error: true
        run: npx prettier --check .

      - name: Lint (ESLint)
        continue-on-error: true
        run: npx eslint .

      - name: Build Dry-run
        continue-on-error: true
        run: npm run build || echo "Build script missing, skipping"

  # ──────────────────────────────────────────────
  # 2. Backend — TypeScript & Validation
  # ──────────────────────────────────────────────
  check-backend:
    name: Backend — Lint & Type Check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: apps/backend/package.json

      - name: Install dependencies
        run: npm install --ignore-scripts

      - name: TypeScript type check
        continue-on-error: true
        run: npx tsc --noEmit

      - name: Check Formatting & Lint
        continue-on-error: true
        run: |
          npx prettier --check .
          npx eslint .

  # ──────────────────────────────────────────────
  # 3. malware-analyzer — Python Quality & Tests
  # ──────────────────────────────────────────────
  check-malware-analyzer:
    name: Malware Analyzer — Pytest & Lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/malware-analyzer
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: apps/malware-analyzer/requirements.txt

      - name: Install system dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y --no-install-recommends libmagic1 yara

      - name: Install Python dependencies
        run: |
          pip install -r requirements.txt
          pip install -r requirements-dev.txt
          pip install black flake8

      - name: Formatting Check (Black)
        continue-on-error: true
        run: black --check .

      - name: Lint (Flake8)
        continue-on-error: true
        run: flake8 .

      - name: Run pytest with coverage
        continue-on-error: true
        run: |
          pytest tests/ -v --tb=short \
            --cov=. \
            --cov-report=xml:coverage.xml \
            --cov-report=term-missing

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: apps/malware-analyzer/coverage.xml
          retention-days: 7

  # ──────────────────────────────────────────────
  # 4. Infrastructure (IaC) — Hadolint & Helm
  # ──────────────────────────────────────────────
  check-iac:
    name: Infrastructure — Lint (Hadolint & Helm)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Hadolint
        run: |
          wget -qO /usr/local/bin/hadolint https://github.com/hadolint/hadolint/releases/download/v2.12.0/hadolint-Linux-x86_64
          chmod +x /usr/local/bin/hadolint

      - name: Lint Dockerfiles
        run: |
          echo "Linting Frontend Dockerfile..."
          hadolint apps/frontend/Dockerfile || true
          echo "Linting Backend Dockerfile..."
          hadolint apps/backend/Dockerfile || true
          echo "Linting Malware Analyzer Dockerfile..."
          hadolint apps/malware-analyzer/Dockerfile || true

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: "v3.17.3"

      - name: Helm lint
        continue-on-error: true
        run: |
          helm lint helm-charts/mijil-chart \
            --set frontend.image.tag=test \
            --set backend.image.tag=test \
            --set malwareAnalyzer.image.tag=test
