name: Production CI/CD Pipeline

on:
  push:
    tags:
      - 'v*.*.*'

env:
  REGISTRY: ghcr.io
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true 

jobs:
  security-lint:
    name: Security & Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          
      - name: Gitleaks (Scan leaked secrets/tokens)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Hadolint (Lint Frontend Dockerfile)
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: apps/frontend/Dockerfile
          failure-threshold: warning

      - name: Hadolint (Lint Backend Dockerfile)
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: apps/backend/Dockerfile
          failure-threshold: warning

  build-scan-push:
    name: Build & CVE Scan
    needs: security-lint
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        app: [frontend, backend]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build image
        uses: docker/build-push-action@v5
        with:
          context: ./apps/${{ matrix.app }}
          load: true
          tags: ${{ env.REGISTRY }}/${{ github.repository }}/portfolio-${{ matrix.app }}:${{ github.ref_name }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@0.28.0
        continue-on-error: true
        with:
          image-ref: '${{ env.REGISTRY }}/${{ github.repository }}/portfolio-${{ matrix.app }}:${{ github.ref_name }}'
          format: 'json'
          output: trivy-${{ matrix.app }}.json
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'

      - name: Generate Markdown Security Report (Safe Mode)
        run: |
          REPORT_FILE="security-report-${{ matrix.app }}.md"
          JSON_FILE="trivy-${{ matrix.app }}.json"
          
          echo "# Security Scan Report: ${{ matrix.app }}" > $REPORT_FILE
          echo "**Image:** \`${{ env.REGISTRY }}/${{ github.repository }}/portfolio-${{ matrix.app }}:${{ github.ref_name }}\`" >> $REPORT_FILE
          echo "" >> $REPORT_FILE
          
          # Kiểm tra file JSON có tồn tại và hợp lệ không trước khi dùng jq
          if [ -f "$JSON_FILE" ] && jq empty "$JSON_FILE" >/dev/null 2>&1; then
            echo "| Severity | CVE ID | Package | Installed | Fixed | Title |" >> $REPORT_FILE
            echo "|---|---|---|---|---|---|" >> $REPORT_FILE
            
            jq -r '.Results[]? | .Vulnerabilities[]? | "| \(.Severity) | [\(.VulnerabilityID)](https://nvd.nist.gov/vuln/detail/\(.VulnerabilityID)) | \(.PkgName) | \(.InstalledVersion) | \(.FixedVersion // "N/A") | \(.Title // "No description" | .[0:80]) |"' "$JSON_FILE" >> $REPORT_FILE || true
            
            CRITICAL_COUNT=$(jq '[.Results[]? | .Vulnerabilities[]? | select(.Severity == "CRITICAL")] | length' "$JSON_FILE" 2>/dev/null || echo "0")
            HIGH_COUNT=$(jq '[.Results[]? | .Vulnerabilities[]? | select(.Severity == "HIGH")] | length' "$JSON_FILE" 2>/dev/null || echo "0")
          else
            echo "_Trivy scan failed, timed out, or produced no output. Please check the pipeline logs._" >> $REPORT_FILE
            CRITICAL_COUNT=0
            HIGH_COUNT=0
          fi
          
          echo "" >> $REPORT_FILE
          echo "_Generated by Trivy on $(date -u)_" >> $REPORT_FILE

          echo "### ${{ matrix.app }} Security Summary" >> $GITHUB_STEP_SUMMARY
          echo "- 🔴 **CRITICAL:** $CRITICAL_COUNT" >> $GITHUB_STEP_SUMMARY
          echo "- 🟠 **HIGH:** $HIGH_COUNT" >> $GITHUB_STEP_SUMMARY

      - name: Push image to GHCR
        run: docker push ${{ env.REGISTRY }}/${{ github.repository }}/portfolio-${{ matrix.app }}:${{ github.ref_name }}

      - name: Upload Artifacts (JSON & Markdown)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-artifacts-${{ matrix.app }}
          path: |
            security-report-${{ matrix.app }}.md
            trivy-${{ matrix.app }}.json

  notify:
    name: Discord Notification
    needs: [security-lint, build-scan-push]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Download Artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: security-artifacts-*
          merge-multiple: true
          path: artifacts
        continue-on-error: true

      - name: Send Discord Notification
        env:
          WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK }}
          RUN_URL: "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [ -z "$WEBHOOK_URL" ]; then
            echo "⚠️ DISCORD_WEBHOOK secret is not set."
            exit 0
          fi

          CRITICAL_TOTAL=0
          HIGH_TOTAL=0
          shopt -s nullglob
          for file in artifacts/trivy-*.json; do
            if jq empty "$file" >/dev/null 2>&1; then
              C=$(jq '[.Results[]? | .Vulnerabilities[]? | select(.Severity == "CRITICAL")] | length' "$file" 2>/dev/null || echo "0")
              H=$(jq '[.Results[]? | .Vulnerabilities[]? | select(.Severity == "HIGH")] | length' "$file" 2>/dev/null || echo "0")
              CRITICAL_TOTAL=$((CRITICAL_TOTAL + C))
              HIGH_TOTAL=$((HIGH_TOTAL + H))
            fi
          done

          TOTAL_VULNS=$((CRITICAL_TOTAL + HIGH_TOTAL))
          
          if [ "$TOTAL_VULNS" -eq 0 ]; then
            COLOR=3066993
            TITLE="✅ Release ${REF_NAME} - Clean & Secure"
            DESC="No CRITICAL or HIGH vulnerabilities found.\nImage pushed to GHCR successfully."
          else
            COLOR=15158332
            TITLE="⚠️ Release ${REF_NAME} - Security Findings Detected"
            DESC="Pipeline completed, but security scan found **${TOTAL_VULNS}** issues.\n\n🔴 **CRITICAL:** ${CRITICAL_TOTAL}\n🟠 **HIGH:** ${HIGH_TOTAL}\n\n📥 **Action Required:** Download the Markdown reports from the **Artifacts** section in the pipeline run link to fix them."
          fi

          cat <<EOF > payload.json
          {
            "embeds": [
              {
                "title": "${TITLE}",
                "description": "${DESC}\n\n**Repository:** ${{ github.repository }}\n**Commit:** \`${{ github.sha }}\`",
                "color": ${COLOR},
                "url": "${RUN_URL}",
                "footer": {
                  "text": "K3s Portfolio Platform CI/CD"
                }
              }
            ]
          }
          EOF

          curl -H "Content-Type: application/json" -X POST -d @payload.json $WEBHOOK_URL
