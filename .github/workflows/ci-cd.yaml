name: Production CI/CD Pipeline

on:
  push:
    tags:
      - 'v*.*.*'

env:
  REGISTRY: ghcr.io
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true 

jobs:
  security-lint:
    name: Security & Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          
      - name: Gitleaks (Scan leaked secrets/tokens)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Hadolint (Lint Frontend Dockerfile)
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: apps/frontend/Dockerfile
          failure-threshold: warning

      - name: Hadolint (Lint Backend Dockerfile)
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: apps/backend/Dockerfile
          failure-threshold: warning

  build-scan-push:
    name: Build & CVE Scan
    needs: security-lint
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        app: [frontend, backend]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build image
        uses: docker/build-push-action@v5
        with:
          context: ./apps/${{ matrix.app }}
          load: true
          tags: ${{ env.REGISTRY }}/${{ github.repository }}/portfolio-${{ matrix.app }}:${{ github.ref_name }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@0.28.0
        continue-on-error: true # Không làm fail pipeline nếu có lỗi
        with:
          image-ref: '${{ env.REGISTRY }}/${{ github.repository }}/portfolio-${{ matrix.app }}:${{ github.ref_name }}'
          format: 'json'
          output: trivy-${{ matrix.app }}.json
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'

      - name: Generate Markdown Security Report
        run: |
          REPORT_FILE="security-report-${{ matrix.app }}.md"
          echo "# Security Scan Report: ${{ matrix.app }}" > $REPORT_FILE
          echo "**Image:** \`${{ env.REGISTRY }}/${{ github.repository }}/portfolio-${{ matrix.app }}:${{ github.ref_name }}\`" >> $REPORT_FILE
          echo "" >> $REPORT_FILE
          
          # Parse JSON và tạo bảng Markdown
          echo "| Severity | CVE ID | Package | Installed | Fixed | Title |" >> $REPORT_FILE
          echo "|---|---|---|---|---|---|" >> $REPORT_FILE
          
          jq -r '.Results[]? | .Vulnerabilities[]? | "| \(.Severity) | [\(.VulnerabilityID)](https://nvd.nist.gov/vuln/detail/\(.VulnerabilityID)) | \(.PkgName) | \(.InstalledVersion) | \(.FixedVersion // "N/A") | \(.Title // "No description" | .[0:80]) |"' trivy-${{ matrix.app }}.json >> $REPORT_FILE
          
          echo "" >> $REPORT_FILE
          echo "_Generated by Trivy on $(date -u)_" >> $REPORT_FILE

          # In tóm tắt ra GitHub Step Summary
          CRITICAL_COUNT=$(jq '[.Results[]? | .Vulnerabilities[]? | select(.Severity == "CRITICAL")] | length' trivy-${{ matrix.app }}.json)
          HIGH_COUNT=$(jq '[.Results[]? | .Vulnerabilities[]? | select(.Severity == "HIGH")] | length' trivy-${{ matrix.app }}.json)
          echo "### ${{ matrix.app }} Security Summary" >> $GITHUB_STEP_SUMMARY
          echo "- 🔴 **CRITICAL:** $CRITICAL_COUNT" >> $GITHUB_STEP_SUMMARY
          echo "- 🟠 **HIGH:** $HIGH_COUNT" >> $GITHUB_STEP_SUMMARY

      - name: Push image to GHCR
        run: docker push ${{ env.REGISTRY }}/${{ github.repository }}/portfolio-${{ matrix.app }}:${{ github.ref_name }}

      - name: Upload Security Report Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-report-${{ matrix.app }}
          path: security-report-${{ matrix.app }}.md

  notify:
    name: Discord Notification
    needs: [security-lint, build-scan-push]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Download Trivy JSONs for Counting
        uses: actions/download-artifact@v4
        with:
          pattern: trivy-summary-* # Nếu có
          merge-multiple: true
          path: trivy-jsons
        continue-on-error: true # Bỏ qua nếu không tìm thấy artifact json

      - name: Send Discord Notification
        env:
          WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK }}
          RUN_URL: "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [ -z "$WEBHOOK_URL" ]; then
            echo "⚠️ DISCORD_WEBHOOK secret is not set."
            exit 0
          fi

          # Tính tổng số lỗi từ các file JSON (nếu tải được)
          CRITICAL_TOTAL=0
          HIGH_TOTAL=0
          shopt -s nullglob
          for file in trivy-jsons/*.json; do
            C=$(jq '[.Results[]? | .Vulnerabilities[]? | select(.Severity == "CRITICAL")] | length' $file)
            H=$(jq '[.Results[]? | .Vulnerabilities[]? | select(.Severity == "HIGH")] | length' $file)
            CRITICAL_TOTAL=$((CRITICAL_TOTAL + C))
            HIGH_TOTAL=$((HIGH_TOTAL + H))
          done

          TOTAL_VULNS=$((CRITICAL_TOTAL + HIGH_TOTAL))
          
          if [ "$TOTAL_VULNS" -eq 0 ]; then
            COLOR=3066993 # Xanh lá
            TITLE="✅ Release ${REF_NAME} - Clean & Secure"
            DESC="No CRITICAL or HIGH vulnerabilities found.\nImage pushed to GHCR successfully."
          else
            COLOR=15158332 # Đỏ
            TITLE="⚠️ Release ${REF_NAME} - Security Findings Detected"
            DESC="Pipeline completed, but security scan found **${TOTAL_VULNS}** issues.\n\n🔴 **CRITICAL:** ${CRITICAL_TOTAL}\n🟠 **HIGH:** ${HIGH_TOTAL}\n\n📥 **Action Required:** Please download the detailed Markdown reports from the **Artifacts** section in the pipeline run link below to fix them."
          fi

          cat <<EOF > payload.json
          {
            "embeds": [
              {
                "title": "${TITLE}",
                "description": "${DESC}\n\n**Repository:** ${{ github.repository }}\n**Commit:** \`${{ github.sha }}\`",
                "color": ${COLOR},
                "url": "${RUN_URL}",
                "footer": {
                  "text": "K3s Portfolio Platform CI/CD"
                }
              }
            ]
          }
          EOF

          curl -H "Content-Type: application/json" -X POST -d @payload.json $WEBHOOK_URL
