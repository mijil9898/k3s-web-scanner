name: DevSecOps Audit & Visibility

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch: {}

permissions:
  contents: read
  security-events: write
  actions: read

env:
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/malware-analyzer

concurrency:
  group: devsecops-audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    name: Audit & Visibility (Non-blocking)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Create artifacts directory
        run: mkdir -p artifacts

      - name: Install SAST tools
        run: |
          python -m pip install --upgrade pip
          pip install "bandit>=1.7.8" bandit-sarif-formatter
          sudo apt-get update -y
          sudo apt-get install -y jq

      # ----------------------
      # 1. SAST: Bandit (Python)
      # ----------------------
      - name: Run Bandit -> JSON & SARIF
        continue-on-error: true
        run: |
          bandit -r . -f json -o artifacts/bandit.json || true
          bandit -r . -f sarif -o artifacts/bandit.sarif || true

      - name: Upload Bandit JSON
        if: hashFiles('artifacts/bandit.json') != ''
        uses: actions/upload-artifact@v4
        with:
          name: bandit-json
          path: artifacts/bandit.json

      - name: Upload Bandit SARIF to Security Tab
        # Chỉ upload nếu file tồn tại VÀ (là lệnh push HOẶC là PR từ chính repo này, không phải fork)
        if: hashFiles('artifacts/bandit.sarif') != '' && (github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository)
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: artifacts/bandit.sarif

      # ----------------------
      # 2. Secret Scanning: Gitleaks
      # ----------------------
      - name: Run Gitleaks -> JSON & SARIF
        continue-on-error: true
        run: |
          GL_VER=8.18.4
          curl -sL https://github.com/zricethezav/gitleaks/releases/download/v${GL_VER}/gitleaks_${GL_VER}_linux_x64.tar.gz | tar xz -C /tmp
          sudo mv /tmp/gitleaks /usr/local/bin/gitleaks
          gitleaks detect --source . --report-format json --report-path artifacts/gitleaks.json || true
          gitleaks detect --source . --report-format sarif --report-path artifacts/gitleaks.sarif || true

      - name: Upload Gitleaks JSON
        if: hashFiles('artifacts/gitleaks.json') != ''
        uses: actions/upload-artifact@v4
        with:
          name: gitleaks-json
          path: artifacts/gitleaks.json

      - name: Upload Gitleaks SARIF
        if: hashFiles('artifacts/gitleaks.sarif') != '' && (github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository)
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: artifacts/gitleaks.sarif

      # ----------------------
      # 3. SCA: Trivy Filesystem (Dùng Official Action thay vì docker run để tránh lỗi ngầm)
      # ----------------------
      - name: Run Trivy FS (JSON)
        uses: aquasecurity/trivy-action@master
        continue-on-error: true
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'json'
          output: 'artifacts/trivy-fs.json'

      - name: Run Trivy FS (SARIF)
        uses: aquasecurity/trivy-action@master
        continue-on-error: true
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'artifacts/trivy-fs.sarif'

      - name: Upload Trivy FS JSON
        if: hashFiles('artifacts/trivy-fs.json') != ''
        uses: actions/upload-artifact@v4
        with:
          name: trivy-fs-json
          path: artifacts/trivy-fs.json

      - name: Upload Trivy FS SARIF
        if: hashFiles('artifacts/trivy-fs.sarif') != '' && (github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository)
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: artifacts/trivy-fs.sarif

      # ----------------------
      # 4. Container Build & Image Scan
      # ----------------------
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        id: build-image
        continue-on-error: true
        run: |
          docker build -t $IMAGE_NAME:${{ github.sha }} . || echo "Build failed, skipping image scan"
          echo "IMAGE=$IMAGE_NAME:${{ github.sha }}" >> $GITHUB_OUTPUT

      - name: Run Trivy Image (JSON)
        if: steps.build-image.outcome == 'success'
        uses: aquasecurity/trivy-action@master
        continue-on-error: true
        with:
          image-ref: ${{ env.IMAGE_NAME }}:${{ github.sha }}
          format: 'json'
          output: 'artifacts/trivy-image.json'

      - name: Run Trivy Image (SARIF)
        if: steps.build-image.outcome == 'success'
        uses: aquasecurity/trivy-action@master
        continue-on-error: true
        with:
          image-ref: ${{ env.IMAGE_NAME }}:${{ github.sha }}
          format: 'sarif'
          output: 'artifacts/trivy-image.sarif'

      - name: Upload Trivy Image JSON
        if: hashFiles('artifacts/trivy-image.json') != ''
        uses: actions/upload-artifact@v4
        with:
          name: trivy-image-json
          path: artifacts/trivy-image.json

      - name: Upload Trivy Image SARIF
        if: hashFiles('artifacts/trivy-image.sarif') != '' && (github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository)
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: artifacts/trivy-image.sarif

      # ----------------------
      # 5. SBOM Generation (Dùng Official Anchore Action)
      # ----------------------
      - name: Generate SBOM with Syft
        if: steps.build-image.outcome == 'success'
        uses: anchore/sbom-action@v0
        continue-on-error: true
        with:
          image: ${{ env.IMAGE_NAME }}:${{ github.sha }}
          format: spdx-json
          output-file: artifacts/syft-spdx.json

      - name: Upload SBOM
        if: hashFiles('artifacts/syft-spdx.json') != ''
        uses: actions/upload-artifact@v4
        with:
          name: syft-spdx
          path: artifacts/syft-spdx.json

      # ----------------------
      # 6. Aggregate & Job Summary
      # ----------------------
      - name: Aggregate findings and write Job Summary
        continue-on-error: true
        run: |
          CRITICAL=0; HIGH=0; MEDIUM=0; LOW=0
          
          count_trivy() {
            local file="$1"
            if [ -f "$file" ]; then
              c=$(jq '[.Results[]? | .Vulnerabilities[]? | select(.Severity=="CRITICAL")] | length' "$file" 2>/dev/null || echo 0)
              h=$(jq '[.Results[]? | .Vulnerabilities[]? | select(.Severity=="HIGH")] | length' "$file" 2>/dev/null || echo 0)
              m=$(jq '[.Results[]? | .Vulnerabilities[]? | select(.Severity=="MEDIUM")] | length' "$file" 2>/dev/null || echo 0)
              l=$(jq '[.Results[]? | .Vulnerabilities[]? | select(.Severity=="LOW")] | length' "$file" 2>/dev/null || echo 0)
              CRITICAL=$((CRITICAL + c)); HIGH=$((HIGH + h)); MEDIUM=$((MEDIUM + m)); LOW=$((LOW + l))
            fi
          }

          if [ -f artifacts/bandit.json ]; then
            bc=$(jq '[.results[]? | select(.issue_severity=="HIGH")] | length' artifacts/bandit.json 2>/dev/null || echo 0)
            bm=$(jq '[.results[]? | select(.issue_severity=="MEDIUM")] | length' artifacts/bandit.json 2>/dev/null || echo 0)
            bl=$(jq '[.results[]? | select(.issue_severity=="LOW")] | length' artifacts/bandit.json 2>/dev/null || echo 0)
            HIGH=$((HIGH + bc)); MEDIUM=$((MEDIUM + bm)); LOW=$((LOW + bl))
          fi

          count_trivy artifacts/trivy-fs.json
          count_trivy artifacts/trivy-image.json

          if [ -f artifacts/gitleaks.json ]; then
            gl=$(jq 'length' artifacts/gitleaks.json 2>/dev/null || echo 0)
            HIGH=$((HIGH + gl))
          fi

          echo "# 🛡️ DevSecOps Audit Summary" >> $GITHUB_STEP_SUMMARY
          echo "| Severity | Count |" >> $GITHUB_STEP_SUMMARY
          echo "|---:|---:|" >> $GITHUB_STEP_SUMMARY
          echo "| 🔴 Critical | $CRITICAL |" >> $GITHUB_STEP_SUMMARY
          echo "| 🟠 High | $HIGH |" >> $GITHUB_STEP_SUMMARY
          echo "| 🟡 Medium | $MEDIUM |" >> $GITHUB_STEP_SUMMARY
          echo "| 🔵 Low | $LOW |" >> $GITHUB_STEP_SUMMARY