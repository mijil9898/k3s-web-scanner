name: CD

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Image tag to deploy (default: sha-<latest commit>)"
        required: false
        default: ""

permissions:
  contents: write # Needed for GitHub Releases
  packages: write
  security-events: write

concurrency:
  group: cd-production
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  OWNER: ${{ github.repository_owner }}
  HELM_CHART: helm-charts/mijil-chart
  HELM_RELEASE: mijil
  K8S_NAMESPACE: default

jobs:
  # ──────────────────────────────────────────────────────────────
  # Kiểm tra trạng thái CI & Chuẩn bị Tags
  # ──────────────────────────────────────────────────────────────
  guard:
    name: Check CI Status
    runs-on: ubuntu-latest
    outputs:
      should_run: ${{ steps.check.outputs.should_run }}
      image_sha: ${{ steps.check.outputs.image_sha }}
      is_tag: ${{ steps.check.outputs.is_tag }}
    steps:
      - name: Evaluate trigger
        id: check
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "should_run=true" >> $GITHUB_OUTPUT
            echo "image_sha=${{ github.sha }}" >> $GITHUB_OUTPUT
            echo "is_tag=false" >> $GITHUB_OUTPUT
          elif [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            echo "should_run=true" >> $GITHUB_OUTPUT
            echo "image_sha=${{ github.sha }}" >> $GITHUB_OUTPUT
            echo "is_tag=true" >> $GITHUB_OUTPUT
          elif [ "${{ github.event.workflow_run.conclusion }}" = "success" ]; then
            echo "should_run=true" >> $GITHUB_OUTPUT
            echo "image_sha=${{ github.event.workflow_run.head_sha }}" >> $GITHUB_OUTPUT
            echo "is_tag=false" >> $GITHUB_OUTPUT
          else
            echo "should_run=false" >> $GITHUB_OUTPUT
            echo "image_sha=" >> $GITHUB_OUTPUT
            echo "is_tag=false" >> $GITHUB_OUTPUT
            echo "::notice::CI did not pass or not a valid trigger. Skipping CD."
          fi

  # ──────────────────────────────────────────────────────────────
  # Build, Quét & Đẩy Image
  # ──────────────────────────────────────────────────────────────
  build-and-push:
    name: Build & Push — ${{ matrix.service.name }}
    needs: guard
    if: needs.guard.outputs.should_run == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service:
          - name: frontend
            context: apps/frontend
            image: mijil-frontend
          - name: backend
            context: apps/backend
            image: mijil-backend
          - name: malware-analyzer
            context: apps/malware-analyzer
            image: malware-analyzer

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.guard.outputs.image_sha }}

      - name: Set up QEMU (For Multi-arch)
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.OWNER }}/${{ matrix.service.image }}
          tags: |
            type=sha,prefix=sha-,format=short
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' || needs.guard.outputs.is_tag == 'true' }}
            type=semver,pattern={{version}}

      - name: Build and push image
        id: docker_build
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.service.context }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.service.name }}
          cache-to: type=gha,scope=${{ matrix.service.name }},mode=max

      # ──────────────────────────────────────────────────────────────
      # Quét Image bằng Trivy (Chỉ cảnh báo)
      # ──────────────────────────────────────────────────────────────
      - name: Run Trivy Image Scan
        uses: aquasecurity/trivy-action@master
        continue-on-error: true
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.OWNER }}/${{ matrix.service.image }}@${{ steps.docker_build.outputs.digest }}
          format: 'sarif'
          output: 'trivy-image-results.sarif'
          severity: 'CRITICAL,HIGH'

      - name: Upload Trivy Scan Results to GitHub Security tab
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: 'trivy-image-results.sarif'
          category: trivy-image-${{ matrix.service.name }}

      - name: Write build summary
        run: |
          SHORT_SHA="${{ needs.guard.outputs.image_sha }}"
          SHORT_SHA="sha-${SHORT_SHA:0:7}"
          echo "### 📦 ${{ matrix.service.name }} Built & Scanned" >> $GITHUB_STEP_SUMMARY
          echo "- **Image**: \`${{ env.REGISTRY }}/${{ env.OWNER }}/${{ matrix.service.image }}:${SHORT_SHA}\`" >> $GITHUB_STEP_SUMMARY

  # ──────────────────────────────────────────────────────────────
  # Tạo Bản phát hành (Chỉ khi có Tag)
  # ──────────────────────────────────────────────────────────────
  create-release:
    name: Auto Release Notes
    needs: [guard, build-and-push]
    if: needs.guard.outputs.is_tag == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true

  # ──────────────────────────────────────────────────────────────
  # Triển khai lên K3s với Tự động Rollback
  # ──────────────────────────────────────────────────────────────
  deploy:
    name: Deploy to K3s & Rollback
    needs: [build-and-push, guard]
    if: needs.guard.outputs.should_run == 'true'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: "v1.31.0"

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: "v3.17.3"

      - name: Configure kubeconfig
        run: |
          mkdir -p ~/.kube
          echo "${{ secrets.KUBECONFIG }}" | base64 -d > ~/.kube/config
          chmod 600 ~/.kube/config
          kubectl cluster-info

      - name: Compute image tag
        id: tag
        run: |
          if [ -n "${{ github.event.inputs.image_tag }}" ]; then
            echo "tag=${{ github.event.inputs.image_tag }}" >> $GITHUB_OUTPUT
          else
            SHA="${{ needs.guard.outputs.image_sha }}"
            echo "tag=sha-${SHA:0:7}" >> $GITHUB_OUTPUT
          fi

      - name: Helm upgrade --install (Atomic = Auto Rollback)
        run: |
          IMAGE_TAG="${{ steps.tag.outputs.tag }}"
          helm upgrade --install ${{ env.HELM_RELEASE }} ${{ env.HELM_CHART }} \
            --namespace ${{ env.K8S_NAMESPACE }} \
            --create-namespace \
            --set global.imageRegistry=${{ env.REGISTRY }}/${{ env.OWNER }} \
            --set frontend.image.tag="${IMAGE_TAG}" \
            --set backend.image.tag="${IMAGE_TAG}" \
            --set malwareAnalyzer.image.tag="${IMAGE_TAG}" \
            --wait \
            --timeout=5m \
            --atomic

      - name: Verify rollout
        run: |
          kubectl rollout status deployment \
            --namespace ${{ env.K8S_NAMESPACE }} \
            --timeout=3m
          echo "### 🚀 Deploy Complete" >> $GITHUB_STEP_SUMMARY
          echo "- **Tag**: \`${{ steps.tag.outputs.tag }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Namespace**: \`${{ env.K8S_NAMESPACE }}\`" >> $GITHUB_STEP_SUMMARY

  # ──────────────────────────────────────────────────────────────
  # Thông báo
  # ──────────────────────────────────────────────────────────────
  notify:
    name: Notify
    needs: [guard, deploy]
    if: always() && needs.guard.outputs.should_run == 'true'
    uses: ./.github/workflows/_notify.yml
    with:
      status: ${{ needs.deploy.result }}
      service_list: "frontend, backend, malware-analyzer"
      run_url: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      sha: ${{ needs.guard.outputs.image_sha }}
      ref_name: ${{ github.ref_name }}
    secrets:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
