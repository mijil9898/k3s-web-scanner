name: CD

on:
  # Trigger only when CI workflow completes successfully on main
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]
  # Allow manual trigger for emergency deploys
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Image tag to deploy (default: sha-<latest commit>)"
        required: false
        default: ""

permissions:
  contents: read
  packages: write  # Required to push to ghcr.io

concurrency:
  group: cd-production
  cancel-in-progress: false  # Never cancel an in-flight deploy

env:
  REGISTRY: ghcr.io
  OWNER: ${{ github.repository_owner }}
  HELM_CHART: helm-charts/mijil-chart
  HELM_RELEASE: mijil
  K8S_NAMESPACE: default

jobs:
  # ──────────────────────────────────────────────────────────────
  # Guard: only proceed if CI passed (for workflow_run trigger)
  # Manual dispatch always proceeds.
  # ──────────────────────────────────────────────────────────────
  guard:
    name: Check CI Status
    runs-on: ubuntu-latest
    outputs:
      should_run: ${{ steps.check.outputs.should_run }}
      image_sha: ${{ steps.check.outputs.image_sha }}
    steps:
      - name: Evaluate trigger
        id: check
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "should_run=true" >> $GITHUB_OUTPUT
            echo "image_sha=${{ github.sha }}" >> $GITHUB_OUTPUT
          elif [ "${{ github.event.workflow_run.conclusion }}" = "success" ]; then
            echo "should_run=true" >> $GITHUB_OUTPUT
            echo "image_sha=${{ github.event.workflow_run.head_sha }}" >> $GITHUB_OUTPUT
          else
            echo "should_run=false" >> $GITHUB_OUTPUT
            echo "image_sha=" >> $GITHUB_OUTPUT
            echo "::notice::CI did not pass (conclusion: ${{ github.event.workflow_run.conclusion }}). Skipping CD."
          fi

  # ──────────────────────────────────────────────────────────────
  # Build & Push — matrix: frontend / backend / malware-analyzer
  # ──────────────────────────────────────────────────────────────
  build-and-push:
    name: Build & Push — ${{ matrix.service.name }}
    needs: guard
    if: needs.guard.outputs.should_run == 'true'
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false   # Don't cancel other matrix jobs if one fails
      matrix:
        service:
          - name: frontend
            context: apps/frontend
            image: mijil-frontend
          - name: backend
            context: apps/backend
            image: mijil-backend
          - name: malware-analyzer
            context: apps/malware-analyzer
            image: malware-analyzer

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.guard.outputs.image_sha }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags & labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.OWNER }}/${{ matrix.service.image }}
          tags: |
            # sha-<short-sha> tag always
            type=sha,prefix=sha-,format=short
            # latest tag only on main branch
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' || github.event.workflow_run.head_branch == 'main' }}
            # semver tags (e.g. v1.2.3) when triggered by a git tag
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.service.context }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # GitHub Actions cache for Docker layers
          cache-from: type=gha,scope=${{ matrix.service.name }}
          cache-to: type=gha,scope=${{ matrix.service.name }},mode=max

      - name: Write build summary
        run: |
          SHORT_SHA="${{ needs.guard.outputs.image_sha }}"
          SHORT_SHA="sha-${SHORT_SHA:0:7}"
          echo "### 📦 ${{ matrix.service.name }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Image**: \`${{ env.REGISTRY }}/${{ env.OWNER }}/${{ matrix.service.image }}:${SHORT_SHA}\`" >> $GITHUB_STEP_SUMMARY

  # ──────────────────────────────────────────────────────────────
  # Helm lint — validate chart before deploy
  # ──────────────────────────────────────────────────────────────
  helm-lint:
    name: Helm Lint & Validate
    needs: guard
    if: needs.guard.outputs.should_run == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: "v3.17.3"

      - name: Helm lint
        run: |
          helm lint ${{ env.HELM_CHART }} \
            --set frontend.image.tag=sha-test \
            --set backend.image.tag=sha-test \
            --set malwareAnalyzer.image.tag=sha-test

      - name: Helm template (dry-run render)
        run: |
          helm template ${{ env.HELM_RELEASE }} ${{ env.HELM_CHART }} \
            --namespace ${{ env.K8S_NAMESPACE }} \
            --set frontend.image.tag=sha-test \
            --set backend.image.tag=sha-test \
            --set malwareAnalyzer.image.tag=sha-test \
            > /tmp/helm-rendered.yaml
          echo "✅ helm template rendered $(wc -l < /tmp/helm-rendered.yaml) lines" >> $GITHUB_STEP_SUMMARY

  # ──────────────────────────────────────────────────────────────
  # Deploy — helm upgrade on K3s via KUBECONFIG secret
  # ──────────────────────────────────────────────────────────────
  deploy:
    name: Deploy to K3s
    needs: [build-and-push, helm-lint]
    if: needs.guard.outputs.should_run == 'true'
    runs-on: ubuntu-latest
    environment: production    # Requires manual approval gate if configured in repo settings

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: "v1.31.0"

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: "v3.17.3"

      - name: Configure kubeconfig
        run: |
          mkdir -p ~/.kube
          echo "${{ secrets.KUBECONFIG }}" | base64 -d > ~/.kube/config
          chmod 600 ~/.kube/config
          kubectl cluster-info

      - name: Compute image tag
        id: tag
        run: |
          if [ -n "${{ github.event.inputs.image_tag }}" ]; then
            echo "tag=${{ github.event.inputs.image_tag }}" >> $GITHUB_OUTPUT
          else
            SHA="${{ needs.guard.outputs.image_sha }}"
            echo "tag=sha-${SHA:0:7}" >> $GITHUB_OUTPUT
          fi

      - name: Helm upgrade --install
        run: |
          IMAGE_TAG="${{ steps.tag.outputs.tag }}"
          helm upgrade --install ${{ env.HELM_RELEASE }} ${{ env.HELM_CHART }} \
            --namespace ${{ env.K8S_NAMESPACE }} \
            --create-namespace \
            --set global.imageRegistry=${{ env.REGISTRY }}/${{ env.OWNER }} \
            --set frontend.image.tag="${IMAGE_TAG}" \
            --set backend.image.tag="${IMAGE_TAG}" \
            --set malwareAnalyzer.image.tag="${IMAGE_TAG}" \
            --wait \
            --timeout=5m \
            --atomic

      - name: Verify rollout
        run: |
          kubectl rollout status deployment \
            --namespace ${{ env.K8S_NAMESPACE }} \
            --timeout=3m
          echo "### 🚀 Deploy Complete" >> $GITHUB_STEP_SUMMARY
          echo "- **Tag**: \`${{ steps.tag.outputs.tag }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Namespace**: \`${{ env.K8S_NAMESPACE }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Release**: \`${{ env.HELM_RELEASE }}\`" >> $GITHUB_STEP_SUMMARY

  # ──────────────────────────────────────────────────────────────
  # Notify — always runs after deploy (success or failure)
  # ──────────────────────────────────────────────────────────────
  notify:
    name: Notify
    needs: [guard, deploy]
    if: always() && needs.guard.outputs.should_run == 'true'
    uses: ./.github/workflows/_notify.yml
    with:
      status: ${{ needs.deploy.result }}
      service_list: "frontend, backend, malware-analyzer"
      run_url: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      sha: ${{ needs.guard.outputs.image_sha }}
      ref_name: ${{ github.ref_name }}
    secrets:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
