name: CI/CD Smoke Test

on:
  workflow_dispatch: {}

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Print environment
        run: |
          echo "Runner OK"
          echo "GitHub Repo: $GITHUB_REPOSITORY"
          uname -a || true
      - name: List secrets
        run: gh secret list --repo $GITHUB_REPOSITORY || true
