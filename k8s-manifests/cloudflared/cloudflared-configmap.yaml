apiVersion: v1
kind: ConfigMap
metadata:
  name: cloudflared-config
  namespace: portfolio
data:
  config.yml: |
    # Replace <TUNNEL-UUID> with the tunnel id from the credentials JSON.
    tunnel: <TUNNEL-UUID>
    credentials-file: /etc/cloudflared/credentials.json
    ingress:
      - hostname: note-audio-registry-scoring.trycloudflare.com
        service: http://malware-analyzer-service.portfolio.svc.cluster.local:5000
      - service: http_status:404
