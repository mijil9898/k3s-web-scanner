services:
  frontend:
    build: ./apps/frontend
    restart: unless-stopped
    ports:
      - '3000:80'
    depends_on:
      backend:
        condition: service_healthy
      malware-analyzer:
        condition: service_healthy
    networks:
      - app-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80/"]
      interval: 30s
      timeout: 10s
      retries: 3

  backend:
    build: ./apps/backend
    restart: unless-stopped
    ports:
      - '8080:8080'
    environment:
      DB_HOST: db
      DB_PORT: "5432"
      DB_NAME: ${DB_NAME:-mijil}
      DB_USER: ${DB_USER:-mijil}
      DB_PASSWORD: ${DB_PASSWORD:?err_DB_PASSWORD_not_set}
      NODE_ENV: ${NODE_ENV:-production}
      PORT: "8080"
    depends_on:
      db:
        condition: service_healthy
    networks:
      app-net:
        aliases:
          - backend-service
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  malware-analyzer:
    build: ./apps/malware-analyzer
    restart: unless-stopped
    ports:
      - '5000:5000'
    environment:
      FLASK_DEBUG: "false"
      SECRET_KEY: ${MALWARE_SECRET_KEY:?err_MALWARE_SECRET_KEY_not_set}
      ALLOW_PUBLIC_UPLOADS: ${ALLOW_PUBLIC_UPLOADS:-false}
      ANALYZE_AUTH_TOKEN: ${ANALYZE_AUTH_TOKEN:-}
      ANALYZE_RATE_LIMIT_PER_MINUTE: ${ANALYZE_RATE_LIMIT_PER_MINUTE:-30}
      VT_API_KEY: ${VT_API_KEY:-}
      OTX_API_KEY: ${OTX_API_KEY:-}
      NEO4J_URI: "bolt://neo4j:7687"
      NEO4J_USER: ${NEO4J_USER:-neo4j}
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:-password}
    depends_on:
      neo4j:
        condition: service_healthy
    volumes:
      - ./apps/malware-analyzer/uploads:/app/uploads
      - ./apps/malware-analyzer/reports:/app/reports
      - ./apps/malware-analyzer/yara_rules:/app/yara_rules
    networks:
      app-net:
        aliases:
          - malware-analyzer-service
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/"]
      interval: 30s
      timeout: 10s
      retries: 3

  db:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-mijil}
      POSTGRES_USER: ${DB_USER:-mijil}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?err_DB_PASSWORD_not_set}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./apps/database/init.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - '5433:5432'
    networks:
      - app-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-mijil} -d ${DB_NAME:-mijil}"]
      interval: 10s
      timeout: 5s
      retries: 5

  neo4j:
    image: neo4j:5-community
    restart: unless-stopped
    environment:
      NEO4J_AUTH: ${NEO4J_AUTH:-neo4j/password}
    ports:
      - '7474:7474'
      - '7687:7687'
    volumes:
      - neo4jdata:/data
    networks:
      - app-net
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -u neo4j -p ${NEO4J_PASSWORD:-password} 'RETURN 1' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
  neo4jdata:

networks:
  app-net:
    driver: bridge