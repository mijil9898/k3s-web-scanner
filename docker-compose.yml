services:
  frontend:
    build: ./apps/frontend
    ports:
      - '3000:80'
    depends_on:
      - backend
    networks:
      - app-net

  backend:
    build: ./apps/backend
    ports:
      - '8080:8080'
    environment:
      DB_HOST: db
      DB_PORT: "5432"
      DB_NAME: portfolio
      DB_USER: portfolio
      DB_PASSWORD: secret
      NODE_ENV: development
      PORT: "8080"
    depends_on:
      - db
    networks:
      app-net:
        aliases:
          - backend-service

  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: portfolio
      POSTGRES_USER: portfolio
      POSTGRES_PASSWORD: secret
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./apps/database/init.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - '5433:5432'
    networks:
      - app-net

volumes:
  pgdata:

networks:
  app-net:
    driver: bridge
