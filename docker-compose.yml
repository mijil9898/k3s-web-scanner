services:
  frontend:
    build: ./apps/frontend
    ports:
      - '3000:80'
    depends_on:
      - backend
      - malware-analyzer
    networks:
      - app-net

  backend:
    build: ./apps/backend
    ports:
      - '8080:8080'
    environment:
      DB_HOST: db
      DB_PORT: "5432"
      DB_NAME: ${DB_NAME:-mijil}
      DB_USER: ${DB_USER:-mijil}
      DB_PASSWORD: ${DB_PASSWORD:?err_DB_PASSWORD_not_set}
      NODE_ENV: ${NODE_ENV:-production}
      PORT: "8080"
    depends_on:
      - db
    networks:
      app-net:
        aliases:
          - backend-service

  malware-analyzer:
    build: ./apps/malware-analyzer
    ports:
      - '5000:5000'
    environment:
      FLASK_DEBUG: "false"
      SECRET_KEY: ${MALWARE_SECRET_KEY:?err_MALWARE_SECRET_KEY_not_set}
      ALLOW_PUBLIC_UPLOADS: ${ALLOW_PUBLIC_UPLOADS:-false}
      ANALYZE_AUTH_TOKEN: ${ANALYZE_AUTH_TOKEN:-}
      ANALYZE_RATE_LIMIT_PER_MINUTE: ${ANALYZE_RATE_LIMIT_PER_MINUTE:-30}
      VT_API_KEY: ${VT_API_KEY:-}
      OTX_API_KEY: ${OTX_API_KEY:-}
    volumes:
      - ./apps/malware-analyzer/uploads:/app/uploads
      - ./apps/malware-analyzer/reports:/app/reports
      - ./apps/malware-analyzer/yara_rules:/app/yara_rules
    networks:
      app-net:
        aliases:
          - malware-analyzer-service

  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: ${DB_NAME:-mijil}
      POSTGRES_USER: ${DB_USER:-mijil}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?err_DB_PASSWORD_not_set}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./apps/database/init.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - '5433:5432'
    networks:
      - app-net

volumes:
  pgdata:

networks:
  app-net:
    driver: bridge