global:
  imageRegistry: ""

frontend:
  replicaCount: 2
  image:
    repository: mijil-frontend
    tag: latest
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
    port: 80
  hpa:
    enabled: true
    minReplicas: 2
    maxReplicas: 10
    cpuUtilization: 70

backend:
  replicaCount: 2
  image:
    repository: mijil-backend
    tag: latest
    pullPolicy: IfNotPresent
  env:
    NODE_ENV: production
    PORT: '8080'

database:
  enabled: true
  storage: 10Gi
  storageClass: local-path

ingress:
  enabled: true
  host: mijil.yourdomain.com
  tls: true
  clusterIssuer: letsencrypt-prod

malwareAnalyzer:
  enabled: true
  replicaCount: 1
  image:
    repository: malware-analyzer
    tag: latest
    pullPolicy: IfNotPresent
  service:
    port: 5000
  # If true, the malware-analyzer will allow uploads from any client (no Bearer token required).
  # Set to false to require ANALYZE_AUTH_TOKEN via the secret.
  allowPublicUploads: true
  resources:
    requests:
      cpu: "250m"
      memory: "512Mi"
    limits:
      cpu: "1000m"
      memory: "1536Mi"
  pvc:
    enabled: true
    storage: 2Gi
    storageClass: local-path
  envFromSecret: malware-secrets

cloudflared:
  enabled: true
  image:
    repository: cloudflare/cloudflared
    tag: latest
  # Quick Tunnel mode using --url to point to in-cluster service
  quickTunnel: true

monitoring:
  enabled: false
