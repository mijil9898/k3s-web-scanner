global:
  imageRegistry: ""

frontend:
  replicaCount: 2
  image:
    repository: mijil-frontend
    tag: latest
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
    port: 80
  resources:
    requests:
      cpu: "50m"
      memory: "64Mi"
    limits:
      cpu: "200m"
      memory: "128Mi"
  hpa:
    enabled: true
    minReplicas: 2
    maxReplicas: 10
    cpuUtilization: 70


database:
  enabled: true
  storage: 10Gi
  storageClass: local-path
  resources:
    requests:
      cpu: "250m"
      memory: "256Mi"
    limits:
      cpu: "500m"
      memory: "512Mi"

ingress:
  enabled: true
  host: mijil.yourdomain.com
  tls: true
  clusterIssuer: letsencrypt-prod

malwareAnalyzer:
  enabled: true
  replicaCount: 1
  image:
    repository: malware-analyzer
    tag: latest
    pullPolicy: IfNotPresent
  service:
    port: 5000
  # Nếu true, malware-analyzer sẽ cho phép mọi client tải file lên (không yêu cầu Bearer token).
  # Đặt thành false để yêu cầu ANALYZE_AUTH_TOKEN thông qua secret.
  allowPublicUploads: true
  resources:
    requests:
      cpu: "250m"
      memory: "512Mi"
    limits:
      cpu: "1000m"
      memory: "1536Mi"
  hpa:
    enabled: true
    minReplicas: 1
    maxReplicas: 3
    cpuUtilization: 70
  pvc:
    enabled: true
    storage: 2Gi
    storageClass: local-path
  envFromSecret: malware-secrets

cloudflared:
  enabled: true
  image:
    repository: cloudflare/cloudflared
    tag: latest
  # Chế độ Quick Tunnel sử dụng --url để trỏ tới service trong cluster
  quickTunnel: true
  resources:
    requests:
      cpu: "100m"
      memory: "128Mi"
    limits:
      cpu: "250m"
      memory: "256Mi"

monitoring:
  enabled: false

# ── Phase 2: Neo4j Threat Intelligence Graph ──────────────────────────────────
neo4j:
  enabled: true
  image:
    repository: neo4j
    tag: "5.18-community"
  # Thông tin xác thực - lưu trong neo4j-secret (key: password)
  secretName: neo4j-secret
  # Lưu trữ
  storage: 5Gi
  storageClass: local-path
  # Giới hạn bộ nhớ JVM (giữ ở mức nhỏ cho k3s chạy trên một node)
  memory:
    heap: 256m
    pagecache: 256m
  resources:
    requests:
      cpu: "250m"
      memory: "512Mi"
    limits:
      cpu: "500m"
      memory: "768Mi"
