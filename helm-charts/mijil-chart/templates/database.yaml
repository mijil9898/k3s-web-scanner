apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-initdb
  namespace: mijil
data:
  init.sql: |
    CREATE TABLE IF NOT EXISTS projects (
      id          SERIAL PRIMARY KEY,
      title       VARCHAR(255) NOT NULL,
      description TEXT,
      tech_stack  TEXT[],
      github_url  VARCHAR(500),
      demo_url    VARCHAR(500),
      created_at  TIMESTAMP DEFAULT NOW()
    );
    CREATE TABLE IF NOT EXISTS contacts (
      id         SERIAL PRIMARY KEY,
      name       VARCHAR(100) NOT NULL,
      email      VARCHAR(255) NOT NULL,
      message    TEXT,
      created_at TIMESTAMP DEFAULT NOW()
    );
    CREATE TABLE IF NOT EXISTS malware_analyses (
      id            SERIAL PRIMARY KEY,
      analysis_id   UUID NOT NULL UNIQUE,
      filename      VARCHAR(500) NOT NULL,
      file_type     VARCHAR(200),
      sha256        VARCHAR(64),
      md5           VARCHAR(32),
      risk_score    INTEGER DEFAULT 0,
      risk_level    VARCHAR(20) DEFAULT 'UNKNOWN',
      yara_matches  TEXT[],
      mitre_ids     TEXT[],
      has_errors    BOOLEAN DEFAULT FALSE,
      created_at    TIMESTAMP DEFAULT NOW()
    );
    CREATE INDEX IF NOT EXISTS idx_malware_analyses_created_at ON malware_analyses (created_at DESC);
    CREATE INDEX IF NOT EXISTS idx_malware_analyses_risk_level  ON malware_analyses (risk_level);
    CREATE INDEX IF NOT EXISTS idx_malware_analyses_sha256       ON malware_analyses (sha256);
    CREATE TABLE IF NOT EXISTS ml_training_samples (
      id               SERIAL PRIMARY KEY,
      analysis_id      UUID,
      sha256           VARCHAR(64) UNIQUE,
      features         JSONB NOT NULL,
      label            SMALLINT NOT NULL CHECK (label IN (0, 1)),
      malware_family   VARCHAR(200),
      source           VARCHAR(50) DEFAULT 'virustotal',
      used_in_training BOOLEAN DEFAULT FALSE,
      created_at       TIMESTAMP DEFAULT NOW(),
      updated_at       TIMESTAMP DEFAULT NOW()
    );
    CREATE INDEX IF NOT EXISTS idx_ml_samples_label       ON ml_training_samples (label);
    CREATE INDEX IF NOT EXISTS idx_ml_samples_used        ON ml_training_samples (used_in_training);
    CREATE INDEX IF NOT EXISTS idx_ml_samples_created_at  ON ml_training_samples (created_at DESC);
    INSERT INTO projects (title, description, tech_stack)
    VALUES ('k3s-mijil-platform', 'Full-stack K8s deployment', ARRAY['K3s','Docker','Helm','GitHub Actions'])
    ON CONFLICT DO NOTHING;
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: mijil
spec:
  serviceName: postgres-service
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
      - name: postgres
        image: postgres:15-alpine
        ports:
        - containerPort: 5432
        resources:
          requests:
            cpu: {{ .Values.database.resources.requests.cpu | quote }}
            memory: {{ .Values.database.resources.requests.memory | quote }}
          limits:
            cpu: {{ .Values.database.resources.limits.cpu | quote }}
            memory: {{ .Values.database.resources.limits.memory | quote }}
        env:
        - name: POSTGRES_USER
          value: "mijil"
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: postgres-secret
              key: password
        - name: POSTGRES_DB
          value: "mijil"
        volumeMounts:
        - name: postgres-data
          mountPath: /var/lib/postgresql/data
          subPath: pgdata # Tránh lỗi phân quyền thư mục data của Postgres
        - name: initdb
          mountPath: /docker-entrypoint-initdb.d
      volumes:
      - name: initdb
        configMap:
          name: postgres-initdb
  volumeClaimTemplates:
  - metadata:
      name: postgres-data
    spec:
      accessModes: ['ReadWriteOnce']
      storageClassName: local-path
      resources:
        requests:
          storage: 10Gi
---
apiVersion: v1
kind: Service
metadata:
  name: postgres-service
  namespace: mijil
spec:
  selector:
    app: postgres
  ports:
  - protocol: TCP
    port: 5432
    targetPort: 5432
  clusterIP: None
