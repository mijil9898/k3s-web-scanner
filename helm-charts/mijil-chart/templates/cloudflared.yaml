{{- if .Values.cloudflared.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cloudflared
  namespace: mijil
  labels:
    app: cloudflared
spec:
  replicas: 1
  selector:
    matchLabels:
      app: cloudflared
  template:
    metadata:
      labels:
        app: cloudflared
    spec:
      containers:
        - name: cloudflared
          image: "{{ .Values.cloudflared.image.repository }}:{{ .Values.cloudflared.image.tag }}"
          args:
            - "tunnel"
            - "--url"
            - "http://frontend-service.mijil.svc.cluster.local:80"
          env:
            - name: TUNNEL_DEBUG
              value: "false"
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
          resources:
            requests:
              cpu: {{ .Values.cloudflared.resources.requests.cpu | quote }}
              memory: {{ .Values.cloudflared.resources.requests.memory | quote }}
            limits:
              cpu: {{ .Values.cloudflared.resources.limits.cpu | quote }}
              memory: {{ .Values.cloudflared.resources.limits.memory | quote }}

{{- end }}
